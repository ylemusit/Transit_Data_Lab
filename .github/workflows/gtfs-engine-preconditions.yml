name: GTFS engine synthetic preconditions
on:
  pull_request:
  push:
    branches: [main]
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Checkout pinned NeTEx schema snapshot for validation only
        uses: actions/checkout@v5
        with:
          repository: TransmodelEcosystem/NeTEx
          ref: a94e5e1752bcc13aabb8a1f3d018dc08e6978f42
          path: netex-schema
      - name: Configure offline audit schema path
        shell: bash
        run: |
          test "$(git -C netex-schema rev-parse HEAD)" = "a94e5e1752bcc13aabb8a1f3d018dc08e6978f42"
          echo "NETEX_SCHEMA_PATH=$GITHUB_WORKSPACE/netex-schema/xsd/NeTEx_publication.xsd" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install NeTEx runtime dependency
        run: python -m pip install -r 02_Data_Engineering/NeTEx_Lab/requirements.txt
      - name: Install pinned client PDF dependency
        run: python -m pip install -r 02_Data_Engineering/GTFS_Lab/packaging/client-pdf-requirements.txt
      - name: Verify pinned NeTEx schema and corpus contracts
        run: |
          python tools/netex_verify_schema.py netex-schema
          python tools/netex_source_manifest.py
          python tools/netex_requirements_concepts.py
          python tools/netex_export_registry.py
          python tools/netex_development_corpus.py
          python tools/netex_gate.py
      - name: NeTEx audit tests
        working-directory: 02_Data_Engineering/NeTEx_Lab
        run: python -m unittest discover -s tests -p 'test_netex_*.py'
      - name: NeTEx synthetic E2E and replay
        run: python tools/netex_e2e.py --evidence "$RUNNER_TEMP/netex-e2e.json"
      - name: Upload NeTEx E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: netex-v1-synthetic-e2e
          path: ${{ runner.temp }}/netex-e2e.json
          if-no-files-found: error
      - name: Compile Python
        run: python -m compileall -q tools 02_Data_Engineering/GTFS_Lab/gtfs_lab 02_Data_Engineering/GTFS_Lab/tests 02_Data_Engineering/NeTEx_Lab/netex_lab 02_Data_Engineering/NeTEx_Lab/tests
      - name: Verify portable legal sources
        run: python tools/compliance_portable_gate.py --legal-root . --sources-only > legal-sources-result.json
      - name: Synthetic trust, comparison, corpus and precondition tests
        working-directory: 02_Data_Engineering/GTFS_Lab
        run: |
          python -m unittest discover -s tests -p test_change_attribution_contract.py
          python -m unittest discover -s tests -p test_audit_comparison.py
          python -m unittest discover -s tests -p test_corpus_split_gate.py
          python -m unittest discover -s tests -p test_corpus_lineage_review.py
          python -m unittest discover -s tests -p test_engine_preconditions.py
          python -m unittest discover -s tests -p 'test_g04_identity.py'
          python -m unittest discover -s tests -p 'test_g05_g07_runtimes.py'
          python -m unittest discover -s tests -p 'test_g03_*.py'
          python -m unittest discover -s tests -p 'test_g08_quality.py'
          python -m unittest discover -s tests -p 'test_g09_reporting.py'
          python -m unittest discover -s tests -p 'test_g10_development_gate.py'
          python -m unittest discover -s tests -p 'test_remediation.py'
          python -m unittest discover -s tests -p 'test_client_workflow.py'
          python -m unittest discover -s tests -p 'test_test_bank.py'
      - name: Client Audit Workflow V1 synthetic end-to-end
        working-directory: 02_Data_Engineering/GTFS_Lab
        run: python -m tools.client_workflow_e2e --evidence "$RUNNER_TEMP/client-workflow-e2e.json"
      - name: Install pinned DuckDB CLI for Test Bank acceptance
        # The bank requires database PASS, unlike the earlier packaging-only E2E.
        # Download the same CLI version validated locally; verify release bytes.
        # CLI installation is scoped to this runner and does not alter engines.
        working-directory: 02_Data_Engineering/GTFS_Lab
        run: |
          mkdir -p "$RUNNER_TEMP/tdl-duckdb"
          curl --fail --location --retry 3 https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip -o "$RUNNER_TEMP/tdl-duckdb/cli.zip"
          echo "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05  $RUNNER_TEMP/tdl-duckdb/cli.zip" | sha256sum -c -
          unzip "$RUNNER_TEMP/tdl-duckdb/cli.zip" -d "$RUNNER_TEMP/tdl-duckdb"
          chmod +x "$RUNNER_TEMP/tdl-duckdb/duckdb"
          "$RUNNER_TEMP/tdl-duckdb/duckdb" --version
          echo "$RUNNER_TEMP/tdl-duckdb" >> "$GITHUB_PATH"
      - name: Controlled Test Bank V1 synthetic audit and replay
        working-directory: 02_Data_Engineering/GTFS_Lab
        run: python -m tools.test_bank_e2e --evidence "$RUNNER_TEMP/test-bank-e2e.json"
      - name: Upload Test Bank synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: test-bank-v1-synthetic-e2e
          path: ${{ runner.temp }}/test-bank-e2e.json
          if-no-files-found: error
      - name: M01, M03 and frozen corpus contracts
        working-directory: 02_Data_Engineering/GTFS_Lab
        run: |
          python -m gtfs_lab.trust_gate
          python -m gtfs_lab.golden_contract_gate
          python -m gtfs_lab.golden_corpus_gate
          python -m gtfs_lab.golden_evaluator_gate
          python -m gtfs_lab.corpus_split_gate --inventory corpus/inventory_v1.json --split corpus/split_v1.json --lineage-review corpus/lineage_review_m04a2.json
          python -m gtfs_lab.corpus_split_gate --lineage-review corpus/lineage_review_m04a2.json --lineage-review-only
      - name: Repository whitespace integrity
        run: python tools/diff_whitespace_gate.py origin/main...HEAD
